# Build the Astro docs site (docs/) and deploy it to GitHub Pages.
#
# REPO SETUP, and it does NOT survive a transfer: Settings -> Pages -> Source = "GitHub Actions".
# Transferring the repository resets Pages to "Deploy from a branch", which runs the legacy
# JEKYLL builder over docs/. Jekyll then reads every .astro file's `---` fence as YAML front
# matter and the build dies with "Invalid YAML front matter". That is what happened on the move
# to the biomechlab-cz organisation. The .nojekyll files at the repo root, in docs/ and in
# docs/public/ defang that failure mode, but the Source setting is still the real fix:
#
#   gh api -X POST repos/biomechlab-cz/biosqa/pages -f build_type=workflow   # first time
#   gh api -X PUT  repos/biomechlab-cz/biosqa/pages -f build_type=workflow   # already enabled
#
# Served at https://biomechlab-cz.github.io/biosqa/ (base: /biosqa/ in astro.config.mjs).
name: Deploy docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# allow one concurrent deploy; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
