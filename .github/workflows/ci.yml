name: CI

# Lint-light test gate: run the pytest suite headlessly (offscreen Qt) on every
# push / PR to main, on Linux and Windows. Plus a packaging gate that builds the
# wheel and installs it into a CLEAN venv -- the source checkout can never catch a
# packaging bug (a missing .qml/qmldir/model resolves fine from the working tree),
# so the wheel is exercised as a user would receive it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a COMMIT SHA, not a mutable major tag: `@v4`
# is repointable by the action owner (or anyone who compromises them) and would
# execute new code in this workflow without a single change on our side.
jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      # PySide6 needs a few system libs to import even under the offscreen
      # platform plugin (no display required).
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # Frozen + hash-verified: requirements.lock pins the entire transitive set with
      # SHA-256 hashes, so a tampered/yanked-and-republished sdist on PyPI fails the
      # install instead of silently entering the build.
      - name: Install pinned dependencies (frozen, hash-verified)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Install app (no deps -- they came from the lock)
        run: python -m pip install -e . --no-deps

      - name: Run tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  package:
    name: wheel + clean-venv install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      # Install the built wheel into a venv that has NEVER seen the source tree, then import
      # the app with PYTHONSAFEPATH=1 so cwd is NOT prepended to sys.path -- `import biosqa`
      # can only resolve from the wheel, never from ./biosqa. This is what catches the class
      # of bug this job exists for: a wheel that builds but ships no QML / no qmldir (the
      # Theme singleton silently fails to resolve without it) / no models.
      - name: Install wheel into a clean venv + import smoke check
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONSAFEPATH: '1'
        run: |
          python -m venv cleanvenv
          if [ -d cleanvenv/Scripts ]; then PY=cleanvenv/Scripts/python; else PY=cleanvenv/bin/python; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          "$PY" - <<'PY'
          import biosqa.main as m

          assert "site-packages" in str(m.UI_DIR), f"imported the source tree, not the wheel: {m.UI_DIR}"
          assert m.MAIN_QML.exists(), f"Main.qml missing from the wheel: {m.MAIN_QML}"
          # qmldir is LOAD-BEARING: the `pragma Singleton` Theme does not resolve without it.
          assert (m.UI_DIR / "qmldir").exists(), "qmldir missing from the wheel"
          qml = list(m.UI_DIR.rglob("*.qml"))
          assert len(qml) > 5, f"only {len(qml)} .qml files in the wheel"
          fonts = sorted(p.name for p in m.FONTS_DIR.glob("*.ttf"))
          assert fonts, "bundled fonts missing from the wheel"
          # The models must resolve PACKAGE-relative: there is no repo checkout to fall back
          # to here, which is exactly the installed user's situation.
          assert "site-packages" in str(m.MODELS_DIR), f"models not package-relative: {m.MODELS_DIR}"
          cards = sorted(p.name.split(".")[0] for p in m.MODELS_DIR.glob("*.model_card.json"))
          assert cards, f"no model cards in the wheel ({m.MODELS_DIR})"
          onnx = sorted(p.stem for p in m.MODELS_DIR.glob("*.onnx"))
          assert onnx == cards, f"model/card mismatch in the wheel: {onnx} vs {cards}"
          print(f"OK  qml={len(qml)} fonts={fonts} models={onnx}")
          PY
