name: Release

# On a version tag (e.g. `v0.1.0`), freeze the app with PyInstaller on each OS
# and attach the archives to a DRAFT GitHub Release for review before publish.
# Can also be run manually (workflow_dispatch) to smoke-test the build.
#
# NOTE: build/biosqa.spec is a structurally-correct starting point that has not
# yet been validated on a clean machine (see its header + build/NUITKA_BUILD_NOTES.md).
# The first release build may need spec fixes (PySide6/QML hooks, data-path
# resolution). fail-fast is off so one OS failing does not block the others.
#
# NOT SIGNED. The archives are unsigned: Windows SmartScreen and macOS Gatekeeper will
# warn on first launch. Authenticode (Azure Trusted Signing) and Apple notarization both
# need real certificates + secrets that this repo does not hold; until then SHA256SUMS.txt
# (published beside the archives) is the only integrity check a downloader can perform.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by DEFAULT. Only the publish job is granted `contents: write`, and it runs
# no build code -- so a compromised dependency or PyInstaller hook executing in a build
# job holds a token that cannot write to the repo or mint a release.
permissions:
  contents: read

# Third-party actions are pinned to a COMMIT SHA, not a mutable major tag: `@v2` is
# repointable by the action owner (or anyone who compromises them), and action-gh-release
# runs in the one job that holds a write-scoped token.
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BioSQA-Studio-windows
          - os: macos-latest
            artifact: BioSQA-Studio-macos
          - os: ubuntu-latest
            artifact: BioSQA-Studio-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # Frozen + hash-verified: the shipped binary is built from exactly the transitive
      # set pinned in requirements.lock, not from whatever PyPI resolves to that morning.
      - name: Install pinned dependencies (frozen, hash-verified)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Install app + packaging toolchain
        run: python -m pip install -e ".[packaging]"

      - name: Freeze app (PyInstaller)
        run: pyinstaller build/biosqa.spec --distpath build/dist --workpath build/work --noconfirm

      - name: Package archive
        shell: bash
        run: |
          cd build/dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a "../../${{ matrix.artifact }}.zip" ./*
          else
            zip -r "../../${{ matrix.artifact }}.zip" ./*
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    name: publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the ONLY job that can write to the repo; it builds nothing
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Lets a downloader verify the archive they got is the archive this workflow built.
      # Not a substitute for code signing -- it establishes integrity, not authorship.
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd artifacts
          sha256sum *.zip | tee SHA256SUMS.txt

      - name: Attach to draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          draft: true
          generate_release_notes: true
