# =============================================================================
# BioSQA Studio — desktop application (Plan 2, plans/02_DESKTOP_APP_ENGINEERING_PLAN.md)
# This is a SEPARATE project from the repo-root `biosqa` package (Plan 1 / ML
# training engine). Dependencies here are deliberately DISJOINT from Plan 1's
# training stack (no torch, no mamba, no transformers/mlflow/optuna/etc.) so
# the frozen installer stays small and starts fast. The app consumes Plan 1's
# artifacts (models/*.onnx + models/*.model_card.json) through the contract
# documented in README.md — it never imports Plan 1's training code.
# =============================================================================
[project]
name = "biosqa-studio"
version = "0.0.1"
description = "BioSQA Studio — desktop viewer for GB-scale biosignal recordings with ONNX-driven quality segmentation overlays (PySide6 + QML)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marek Sokol", email = "mareksokol98@gmail.com" }]
keywords = ["signal-quality", "ecg", "ppg", "eeg", "eda", "biosignal", "onnx", "desktop", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Every runtime dep carries a FLOOR and a CEILING. Unbounded deps let a future major
# (numpy 3, PySide 7, ...) land silently in a build and break a clinical-adjacent tool at
# freeze time; requirements.lock pins the exact, hash-verified transitive set that CI and
# the release builds install from. Nothing is listed here that the app does not import --
# pyqtgraph/polars/dask/tsdownsample were carried for years with zero imports and only
# inflated the frozen bundle (~707 MiB).
dependencies = [
    "PySide6>=6.7,<7",       # Qt 6 bindings (LGPL) — QQmlApplicationEngine + custom scene-graph item
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "zarr>=3,<4",            # Zarr v3 store + sharding for the out-of-core waveform + pyramid layer
    "wfdb>=4.1,<5",          # PhysioNet WFDB (.dat/.hea) reader, preload=False
    "mne>=1.6,<2",           # EDF/EDF+ reader, preload=False
    "onnxruntime>=1.17,<2",  # CPU EP — runs Plan 1's exported FP32 models, nothing else
    "pyarrow>=14,<25",       # Parquet recordings + Parquet segment export
]

[project.urls]
Homepage = "https://github.com/biomechlab-cz/biosqa"
Repository = "https://github.com/biomechlab-cz/biosqa"
Issues = "https://github.com/biomechlab-cz/biosqa/issues"

# `biosqa-studio` launches the app after `pip install .` (GUI entry point → no console
# window on Windows); the module form `python -m biosqa.main` also works.
[project.gui-scripts]
biosqa-studio = "biosqa.main:main"

[project.optional-dependencies]
# Packaging toolchains — only needed when producing a distributable build,
# see build/biosqa.spec and build/NUITKA_BUILD_NOTES.md.
packaging = ["pyinstaller", "nuitka"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling ships EVERY non-ignored file under packages= (not just *.py), so biosqa/ui's
# .qml, `qmldir` and fonts are already included -- force-including biosqa/ui again made the
# wheel build abort outright ("A second file is being added ... biosqa/ui/ActivityRail.qml").
# Do not re-add it. `qmldir` is load-bearing: the Theme singleton does not resolve without it.
[tool.hatch.build.targets.wheel]
packages = ["biosqa"]

# The ONNX artifacts + cards live at the repo root (app/models) for the dev checkout and the
# PyInstaller spec, so they are NOT under the package dir and would otherwise be omitted from
# the wheel entirely. Map them in as package data; biosqa.main prefers this package-relative
# copy and falls back to the repo-relative one (see _resolve_models_dir).
[tool.hatch.build.targets.wheel.force-include]
"models" = "biosqa/models"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
