# -----------------------------------------------------------------------------
# Nuitka build flags — BioSQA Studio production build (Plan 2 §13, Phase 5)
#
# This is a PLACEHOLDER flag list, not a parsed config format (Nuitka has no
# single standard "cfg" file; it's driven by CLI flags or `# nuitka-project:`
# comments embedded in the entry-point module). Treat this file as the
# canonical copy-pasteable command for CI until it's wired into an actual
# build script. See build/NUITKA_BUILD_NOTES.md for rationale/pitfalls.
# -----------------------------------------------------------------------------

nuitka \
  --standalone \
  --enable-plugin=pyside6 \
  --include-qt-plugins=platforms,imageformats \
  --include-data-dir=biosqa/ui=biosqa/ui \
  --include-data-dir=models=models \
  --nofollow-import-to=torch \
  --nofollow-import-to=transformers \
  --nofollow-import-to=mlflow \
  --assume-yes-for-downloads \
  --output-dir=build/dist-nuitka \
  biosqa/main.py

# TODO(Plan2 §13): benchmark --onefile vs --standalone startup time; the
# plan recommends one-folder-equivalent (standalone) distribution to avoid
# the temp-dir self-extraction cost of one-file builds on every launch.
